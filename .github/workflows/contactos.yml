name: Buscar contactos

# Busca el mail de contacto de cada evento aprobado que no tenga uno, entrando
# al sitio oficial del propio evento. No corre solo: se dispara a mano desde
# esta pestaña, porque visita sitios de terceros y conviene mirar el resultado.
on:
  workflow_dispatch:
    inputs:
      escribir:
        description: "Guardar en Airtable. En 'no' solo deja el informe para revisar."
        required: false
        default: "no"
        type: choice
        options:
          - "no"
          - "si"
      limite:
        description: "Cuántos eventos mirar. 0 = todos los que falten."
        required: false
        default: "0"

# Dos búsquedas a la vez le pegarían dos veces a los mismos sitios.
concurrency:
  group: contactos
  cancel-in-progress: false

jobs:
  contactos:
    runs-on: ubuntu-latest
    # Entra a ~200 sitios con una pausa entre cada uno: le damos aire.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Los valores del formulario viajan por env, no pegados dentro del `run`.
      # Pegados, GitHub los reemplaza ANTES de que bash lea la línea, así que
      # quien dispara la Action escribe comandos y no un número. Las otras seis
      # Actions ya lo hacen así.
      - name: Buscar los mails
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          LIMITE: ${{ inputs.limite || '0' }}
          ESCRIBIR: ${{ inputs.escribir }}
        run: |
          # Comparación explícita contra "si": cualquier otro valor NO escribe.
          if [ "$ESCRIBIR" = "si" ]; then
            node scripts/buscar-contactos.mjs --limite "$LIMITE" --escribir
          else
            node scripts/buscar-contactos.mjs --limite "$LIMITE"
          fi

      # Acá vivía un paso que subía datos-contactos/ como archivo para bajar.
      # Se sacó el 6/9/2026: en un repo PÚBLICO no existe el archivo privado.
      # Son mails de organizadores, y cualquiera podía bajarlos. El informe se
      # arma igual en la máquina que corre; para leerlo, correr el script local.
