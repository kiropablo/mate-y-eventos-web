name: Agenda

on:
  # Lo dispara el botón de la consola (/admin) y también se puede
  # correr a mano desde esta pestaña.
  workflow_dispatch:
    inputs:
      modo:
        description: "completo = busca en todos los rubros y repasa lo cargado"
        required: false
        default: completo
        type: choice
        options:
          - completo
          - descubrir
          - verificar
          - limpiar
      tema:
        description: "Opcional: buscar solo un tema puntual"
        required: false
        default: ""
      cantidad:
        description: "Máximo de eventos por rubro (pocos y completos rinde más que muchos a medias)"
        required: false
        default: "4"
  schedule:
    # Todos los días a las 11:00 UTC (8 de la mañana en Argentina),
    # una hora antes que las transcripciones para no pisarse.
    - cron: "0 11 * * *"

# Si ya hay una corrida en curso, la nueva espera en vez de arrancar en
# paralelo. Dos barridos simultáneos leen la base antes de que el otro
# escriba, y terminan cargando el mismo evento dos veces.
concurrency:
  group: agenda
  cancel-in-progress: false

jobs:
  agenda:
    runs-on: ubuntu-latest
    # El barrido completo recorre diez rubros: le damos aire.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Actualizar la agenda
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Sin inputs (o sea, en el cron diario) hace el mantenimiento:
          # repasa lo cargado y suma un rubro nuevo, rotando.
          MODO: ${{ inputs.modo || 'diario' }}
          TEMA: ${{ inputs.tema }}
          MAX_EVENTOS: ${{ inputs.cantidad || '4' }}
        # Se guarda la salida porque el robot imprime al final la lista de
        # fichas que tocó, y el paso siguiente la necesita. El pipefail está
        # para que un error de node siga volteando el paso: sin él, el código
        # de salida que cuenta sería el del tee.
        run: |
          set -o pipefail
          node scripts/agenda-ia.mjs | tee /tmp/agenda.log
      # La clave va en la cabecera x-token, no en la dirección: Vercel guarda la
      # URL completa con su querystring en los registros de pedidos, así que un
      # ?token= deja la clave escrita ahí. En la cabecera no viaja a ningún log.
      - name: Refrescar la web
        env:
          REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
        run: |
          if [ -n "$REVALIDATE_TOKEN" ]; then
            # Las fichas que el robot tocó, para que IndexNow se entere de ellas
            # y no solo de los hubs. Sin esto, el dato que se vence —la fecha de
            # cada evento— nunca le llegaba a Bing, que es el que alimenta a
            # ChatGPT y a Copilot.
            #
            # Los slugs no necesitan escaparse: la función slug() del robot deja
            # solo minúsculas, números y guiones.
            SLUGS=$(grep -o '::fichas-tocadas::.*' /tmp/agenda.log | tail -1 | sed 's/^::fichas-tocadas:://')
            URL="https://www.mateyeventos.com/api/agenda/revalidar"
            if [ -n "$SLUGS" ]; then
              echo "Fichas tocadas que se avisan: $(echo "$SLUGS" | tr ',' '\n' | grep -c .)"
              URL="$URL?slugs=$SLUGS"
            else
              echo "El robot no tocó ninguna ficha publicada: se avisan solo los hubs."
            fi
            curl -s -H "x-token: $REVALIDATE_TOKEN" "$URL" || true
          else
            echo "Sin REVALIDATE_TOKEN: la web se actualiza sola dentro de una hora."
          fi

      # Avisar a los que pidieron "avisame cuando confirmen la fecha".
      #
      # Va después del refresco a propósito: primero la web se entera de las
      # fechas nuevas, después se avisa. Y si algo falla no se corta la Action:
      # nadie queda marcado como avisado, así que mañana se reintenta solo.
      - name: Avisar fechas confirmadas
        env:
          REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
        run: |
          if [ -n "$REVALIDATE_TOKEN" ]; then
            curl -s -H "x-token: $REVALIDATE_TOKEN" "https://www.mateyeventos.com/api/agenda/avisos" || true
          else
            echo "Sin REVALIDATE_TOKEN: los avisos de fecha quedan para mañana."
          fi
